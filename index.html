      { t: "06:30", n: "호텔 출발", s: "🚕 점보택시 2대 · ¥36,000 · 45분  |  🚃 뮤스카이 · ¥11,440 (8인) · 28분 + 역 이동", tag: "이동 수단 선택", type: "transit" },
      { t: "07:15", n: "NGO 도착", s: "공항 카운터로 직행", type: "poi", poi: "ngo" },
      { t: "10:25", n: "출발", s: "—", type: "transit" }
    ],
    cost: [
      { l: "호텔→공항 택시 2대", v: "¥36,000" },
      { l: "호텔→공항 뮤스카이 (8인)", v: "¥11,440 (차액 ¥24,560 절약)" }
    ],
    total: "¥36,000",
    restos: [],
    shops: []
  }
};

// =============================================================
// MAP
// =============================================================
const HOTEL = PLACES.hotel;
const map = L.map('map', { zoomControl: true, attributionControl: true })
  .setView([35.155, 136.895], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap, © CARTO', maxZoom: 19
}).addTo(map);

let routeLayer = L.layerGroup().addTo(map);
let markerLayer = L.layerGroup().addTo(map);
let secondaryLayer = L.layerGroup().addTo(map);

function makeIcon(label, color) {
  return L.divIcon({
    html: `<div class="marker-pin" style="border-color:${color};color:${color}">${label}</div>`,
    className: '', iconSize: [28, 28], iconAnchor: [14, 14]
  });
}
function makeSecondaryIcon(type) {
  return L.divIcon({
    html: `<div class="marker-secondary ${type}"></div>`,
    className: '', iconSize: [18, 18], iconAnchor: [9, 9]
  });
}
function makeHeritageIcon() {
  return L.divIcon({
    html: `<div class="marker-heritage">🏮</div>`,
    className: '', iconSize: [32, 32], iconAnchor: [16, 16]
  });
}

function renderRoute(dayKey) {
  routeLayer.clearLayers();
  markerLayer.clearLayers();
  secondaryLayer.clearLayers();

  const day = DAYS[dayKey];
  const color = day.color;
  const pts = [];
  let idx = 1;

  day.items.forEach(it => {
    if (it.type === 'poi' && it.poi && PLACES[it.poi]) {
      const p = PLACES[it.poi];
      if (p.cat === 'base' && it.poi === 'ngo') {
        // NGO too far - don't include in fitBounds normally
        pts.push([p.lat, p.lng]);
        L.marker([p.lat, p.lng], { icon: makeIcon(idx, color) })
          .addTo(markerLayer)
          .bindTooltip(p.name, { direction: 'top', offset: [0, -8] })
          .on('click', () => openPlaceModal(it.poi));
        idx++;
      } else if (p.cat !== 'base') {
        pts.push([p.lat, p.lng]);
        L.marker([p.lat, p.lng], { icon: makeIcon(idx, color) })
          .addTo(markerLayer)
          .bindTooltip(p.name, { direction: 'top', offset: [0, -8] })
          .on('click', () => openPlaceModal(it.poi));
        idx++;
      }
    }
  });

  // Hotel
  if (dayKey !== '4') {
    L.marker([HOTEL.lat, HOTEL.lng], { icon: makeIcon('H', '#1A1818') })
      .addTo(markerLayer)
      .bindTooltip('쿠레타케인 프리미엄 나고야 나야바시 (호텔)', { direction: 'top', offset: [0, -8] })
      .on('click', () => openPlaceModal('hotel'));
    if (dayKey !== '1') {
      pts.unshift([HOTEL.lat, HOTEL.lng]);
      pts.push([HOTEL.lat, HOTEL.lng]);
    }
  }

  // 특별 마커: 할아버지 추정 출생지 (Day 3에만 표시)
  if (dayKey === '3') {
    const bp = PLACES.birthplace;
    L.marker([bp.lat, bp.lng], { icon: makeHeritageIcon() })
      .addTo(markerLayer)
      .bindTooltip('🏮 ' + bp.name, { direction: 'top', offset: [0, -10] })
      .on('click', () => openPlaceModal('birthplace'));
  }

  // Secondary markers (restos/shops/attractions)
  const seen = new Set();
  [...(day.restos || []), ...(day.shops || []), ...(day.attractions || [])].forEach(id => {
    if (seen.has(id)) return;
    seen.add(id);
    const p = PLACES[id];
    if (!p) return;
    const iconType = p.cat === 'shopping' ? 'shop' : p.cat === 'attraction' ? 'sight' : 'resto';
    L.marker([p.lat, p.lng], { icon: makeSecondaryIcon(iconType) })
      .addTo(secondaryLayer)
      .bindTooltip(`${p.cat === 'shopping' ? '🛍️' : p.cat === 'attraction' ? '🏛️' : '🍱'} ${p.name}`, { direction: 'top', offset: [0, -6] })
      .on('click', () => openPlaceModal(id));
  });

  // Polyline
  const inCityPts = pts.filter(([lat, lng]) => lat > 35.0);
  const NGO = [PLACES.ngo.lat, PLACES.ngo.lng];
  const HTL = [HOTEL.lat, HOTEL.lng];

  if (dayKey === '1') {
    // Day 1 동선: 공항 → 나고야역(에스카) → 호텔 → 나고야성
    const escaPt = [PLACES.esca.lat, PLACES.esca.lng];
    const castlePt = [PLACES.castle.lat, PLACES.castle.lng];
    L.polyline([NGO, escaPt], { color: color, weight: 2, opacity: 0.55, dashArray: '4 8' })
      .addTo(routeLayer)
      .bindTooltip('공항 → 나고야역', { sticky: true });
    L.polyline([escaPt, HTL, castlePt], { color: color, weight: 2.5, opacity: 0.85, dashArray: '6 6' })
      .addTo(routeLayer);
    map.fitBounds(L.latLngBounds([NGO, escaPt, HTL, castlePt]), { padding: [60, 60], maxZoom: 11 });
  } else if (dayKey === '4') {
    if (inCityPts.length > 1) {
      L.polyline(inCityPts, { color: color, weight: 2.5, opacity: 0.85, dashArray: '6 6' })
        .addTo(routeLayer);
    }
    L.marker([HOTEL.lat, HOTEL.lng], { icon: makeIcon('H', '#1A1818') })
      .addTo(markerLayer)
      .bindTooltip('쿠레타케인 프리미엄 나고야 나야바시 (호텔)', { direction: 'top', offset: [0, -8] })
      .on('click', () => openPlaceModal('hotel'));
    L.polyline([HTL, NGO], { color: color, weight: 2, opacity: 0.55, dashArray: '4 8' })
      .addTo(routeLayer)
      .bindTooltip('호텔 → 공항', { sticky: true });
    map.fitBounds(L.latLngBounds([NGO, HTL, ...inCityPts]), { padding: [60, 60], maxZoom: 11 });
  } else {
    if (inCityPts.length > 1) {
      L.polyline(inCityPts, { color: color, weight: 2.5, opacity: 0.85, dashArray: '6 6' })
        .addTo(routeLayer);
    }
    if (inCityPts.length > 0) {
      map.fitBounds(L.latLngBounds(inCityPts), { padding: [60, 60], maxZoom: 14 });
    }
  }
}

// =============================================================
// RENDER DAY
// =============================================================
function renderDay(dayKey) {
  const container = document.getElementById('day-content');
  const isDay2 = (dayKey === '2');
  let activeKey = dayKey;
  if (isDay2) activeKey = window._day2Choice || '2a';

  const day = DAYS[activeKey];
  document.documentElement.style.setProperty('--day-color', day.color);

  let html = `
    <div class="day-head">
      <div class="day-date">${day.date}</div>
      <h2 class="day-title">${day.title}</h2>
      <p class="day-desc">${day.desc}</p>
  `;
  if (isDay2) {
    html += `
      <div class="option-toggle">
        <button class="option-btn ${activeKey==='2a'?'active':''}" data-opt="2a">A안 · 오스 상점가</button>
        <button class="option-btn ${activeKey==='2b'?'active':''}" data-opt="2b">B안 · 아츠타 신궁</button>
      </div>`;
  }
  html += `</div><div class="timeline">`;

  day.items.forEach((it, i) => {
    const cls = it.type === 'poi' ? 'item poi' : 'item transit';
    const poiAttr = it.poi ? `data-poi="${it.poi}"` : '';
    html += `
      <div class="${cls}" ${poiAttr} data-idx="${i}">
        <div class="item-time">${it.t}</div>
        <div class="item-body">
          <div class="item-name">${it.n}</div>
          <div class="item-sub">${it.s}</div>
          ${it.tag ? `<div class="item-tag">${it.tag}</div>` : ''}
        </div>
      </div>`;
  });
  html += `</div>`;

  // Attractions
  if (day.attractions && day.attractions.length > 0) {
    html += `<div class="section">
      <div class="section-head">— 볼거리 추천 · Sights</div>
      <div class="card-list">`;
    day.attractions.forEach(id => {
      const p = PLACES[id];
      if (!p) return;
      html += `<div class="card" data-place="${id}">
        <div>
          <div class="card-name"><span class="card-cat" style="color:#1B4D3E">SIGHT</span>${p.name}</div>
          <div class="card-info">${p.jp || ''} · ${p.cost || ''} · ${p.duration || ''}</div>
        </div>
        <div class="card-arrow">→</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Restaurants
  if (day.restos && day.restos.length > 0) {
    html += `<div class="section">
      <div class="section-head">— 식당 추천 · Restaurants</div>
      <div class="card-list">`;
    day.restos.forEach(id => {
      const p = PLACES[id];
      if (!p) return;
      html += `<div class="card" data-place="${id}">
        <div>
          <div class="card-name"><span class="card-cat">FOOD</span>${p.name}</div>
          <div class="card-info">${p.jp || ''} · ${(p.hours || '').split(' ')[0] || ''}</div>
        </div>
        <div class="card-price">${p.cost || ''}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Shopping
  if (day.shops && day.shops.length > 0) {
    html += `<div class="section">
      <div class="section-head">— 쇼핑 추천 · Shopping</div>
      <div class="card-list">`;
    day.shops.forEach(id => {
      const p = PLACES[id];
      if (!p) return;
      html += `<div class="card" data-place="${id}">
        <div>
          <div class="card-name"><span class="card-cat" style="color:#5A6B7D">SHOP</span>${p.name}</div>
          <div class="card-info">${p.jp || ''} · ${p.hours || ''}</div>
        </div>
        <div class="card-arrow">→</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Cost
  html += `<div class="cost-box">
    <div class="cost-head">— 예상 비용 (8인 기준)</div>`;
  day.cost.forEach(c => {
    html += `<div class="cost-row"><span class="lbl">${c.l}</span><span class="val">${c.v}</span></div>`;
  });
  html += `<div class="cost-row cost-total"><span class="lbl">합계</span><span class="val">${day.total}</span></div></div>`;

  container.innerHTML = html;
  renderRoute(activeKey);

  if (isDay2) {
    container.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        window._day2Choice = btn.dataset.opt;
        renderDay('2');
      });
    });
  }
  container.querySelectorAll('.item.poi').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.poi;
      if (k && PLACES[k]) openPlaceModal(k);
    });
  });
  container.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.place;
      if (k && PLACES[k]) openPlaceModal(k);
    });
  });
}

// =============================================================
// MODAL — 통합 (관광지 / 식당 / 쇼핑)
// =============================================================
function openPlaceModal(id) {
  const p = PLACES[id];
  if (!p) return;
  const body = document.getElementById('modal-body');

  const eyebrowMap = { attraction: '관광 · Attraction', restaurant: '식당 · Restaurant', shopping: '쇼핑 · Shopping', base: '기준점' };
  const eyebrow = eyebrowMap[p.cat] || '장소';

  let html = `
    <div class="modal-eyebrow">— ${eyebrow}</div>
    <h3 class="modal-title">${p.name}</h3>
    <div class="modal-sub">${p.jp || ''}</div>
    <div class="modal-text">${p.desc || ''}</div>
  `;

  // Stats
  const stats = [];
  if (p.cost) stats.push(`<div class="modal-stat"><div class="v">${p.cost}</div><div class="l">${p.cat==='restaurant'?'가격대':p.cat==='shopping'?'예산':'비용'}</div></div>`);
  if (p.duration) stats.push(`<div class="modal-stat"><div class="v">${p.duration}</div><div class="l">소요 시간</div></div>`);
  if (p.hours) stats.push(`<div class="modal-stat"><div class="v">${p.hours}</div><div class="l">영업 시간</div></div>`);
  if (stats.length > 0) {
    html += `<div class="modal-section"><div class="modal-grid">${stats.join('')}</div></div>`;
  }

  // Menu
  if (p.menu && p.menu.length > 0) {
    const label = p.cat === 'shopping' ? '주요 구역' : '대표 메뉴';
    html += `<div class="modal-section">
      <div class="modal-label">${label}</div>
      <ul class="modal-menu">`;
    p.menu.forEach(([n, pr]) => {
      html += `<li><span class="m-n">${n}</span><span class="m-p">${pr}</span></li>`;
    });
    html += `</ul></div>`;
  }

  if (p.warn) {
    html += `<div class="modal-warn">⚠ ${p.warn}</div>`;
  }

  // Actions
  html += `<div class="modal-actions">
    <a href="${gmapUrl(p)}" target="_blank" rel="noopener" class="btn primary">📍 구글 지도에서 열기</a>
    <button class="btn" onclick="focusOnMap(${p.lat}, ${p.lng})">지도에서 위치 보기</button>
  </div>`;

  body.innerHTML = html;
  document.getElementById('modal').classList.add('open');
}

function focusOnMap(lat, lng) {
  map.setView([lat, lng], 15, { animate: true });
  closeModal();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// =============================================================
// TABS
// =============================================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderDay(tab.dataset.day);
  });
});

// INIT
renderDay('1');
</script>
